<!-- Top Navbar -->
<header class="top-navbar">
    <div class="navbar-left">
        <button class="sidebar-toggle d-lg-none" id="sidebarToggle">
            <i class="bi bi-list"></i>
        </button>
        <div class="page-title">
            {% block page_title %}Dashboard{% endblock %}
        </div>
    </div>
    <div class="navbar-right">
        <div class="showcase-chip d-none d-xl-inline-flex">
            <i class="bi bi-stars"></i>
            <span>Academic Command Center</span>
        </div>
        <div class="dropdown">
            <button class="btn btn-link nav-profile-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="nav-avatar">
                    {{ user.first_name|default:user.username|make_list|first|upper }}
                </div>
                <span class="d-none d-md-inline nav-username">{{ user.first_name|default:user.username }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li><span class="dropdown-item-text text-muted small">Signed in as <strong>{{ user.username }}</strong></span></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item" href="{% url 'users:logout' %}">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>
