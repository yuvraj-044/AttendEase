{% if messages %}
<div class="messages-wrap">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }}" id="flash-{{ forloop.counter }}">
    {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill"></i>
    {% elif message.tags == 'danger' %}<i class="bi bi-exclamation-triangle-fill"></i>
    {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-circle-fill"></i>
    {% else %}<i class="bi bi-info-circle-fill"></i>{% endif %}
    <div>{{ message }}</div>
    <button class="alert-close" onclick="this.closest('.alert').remove()" aria-label="Close">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  {% endfor %}
</div>
{% endif %}
